spring:
  application:
    name: claimshield-core-api

  datasource:
    url: jdbc:h2:file:./data/claimshield;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

server:
  port: 8080

# CORS for Next.js frontend
cors:
  allowed-origins: http://localhost:3000

# ClaimShield config
claimshield:
  dev-mode: true
  default-tenant-id: "00000000-0000-0000-0000-000000000001"
