name: CI

on:
  push:
    branches: [main]
  # All PRs, so stacked PRs (based on another feature branch) are checked too
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --- Frontend (Next.js) ---
  frontend:
    name: Frontend lint & typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit

  # --- Java services (contract tests on in-memory H2) ---
  java-test:
    name: Java tests (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [core-api, analytics-service, workflow-service]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: services/${{ matrix.service }}/pom.xml
      - run: mvn -B test

  # --- Python shared package ---
  python-lint:
    name: Python lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff mypy pydantic pydantic-settings sqlalchemy fastapi python-jose httpx
      - run: ruff check packages/py-common/
      - run: ruff format --check packages/py-common/

  # --- Python tests ---
  python-test:
    name: Python tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: claimshield_test
          POSTGRES_PASSWORD: claimshield_test
          POSTGRES_DB: claimshield_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U claimshield_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install -e packages/py-common
          pip install pytest pytest-asyncio httpx
      - run: pytest tests/ -v
        env:
          CS_DATABASE_URL: postgresql+asyncpg://claimshield_test:claimshield_test@localhost:5433/claimshield_test

  # --- Security scanning ---
  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/python
            p/javascript
            p/typescript
            p/security-audit
