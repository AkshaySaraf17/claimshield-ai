services:
  # Java services share one H2 file database through the java-data volume (AUTO_SERVER=TRUE)
  core-api:
    build:
      context: .
      dockerfile: services/core-api/Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - java-data:/app/data

  analytics-service:
    build:
      context: .
      dockerfile: services/analytics-service/Dockerfile
    ports:
      - "8081:8081"
    volumes:
      - java-data:/app/data
    depends_on:
      - core-api

  workflow-service:
    build:
      context: .
      dockerfile: services/workflow-service/Dockerfile
    ports:
      - "8082:8082"
    volumes:
      - java-data:/app/data
    depends_on:
      - core-api

  agents:
    build:
      context: .
      dockerfile: services/agents/Dockerfile
    ports:
      - "8001:8001"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - RULES_ENGINE_URL=http://core-api:8080
    depends_on:
      - ollama
      - core-api

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - JAVA_API_URL=http://core-api:8080
      - ANALYTICS_SERVICE_URL=http://analytics-service:8081
      - WORKFLOW_SERVICE_URL=http://workflow-service:8082
      - AGENT_SERVICE_URL=http://agents:8001
    depends_on:
      - core-api
      - analytics-service
      - workflow-service
      - agents

volumes:
  java-data:
  ollama-data:
